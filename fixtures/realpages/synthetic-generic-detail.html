<!doctype html>
<!-- 합성 픽스처(구조 재현) — 비아마존(요시다) 상세. 제네릭 경로(JSON-LD Product) 회귀 검증. -->
<html lang="ja"><head>
<meta charset="utf-8">
<meta property="og:title" content="수제 소가죽 크로스백">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "수제 소가죽 크로스백",
  "image": [
    "https://cdn.example.com/bag-1.jpg",
    "https://cdn.example.com/bag-2.jpg",
    "https://cdn.example.com/bag-3.jpg"
  ],
  "description": "천연 소가죽으로 손바느질한 크로스백입니다.",
  "offers": { "@type": "Offer", "price": "39000", "priceCurrency": "KRW" }
}
</script>
</head><body>
<h1>수제 소가죽 크로스백</h1>
<div class="product-gallery">
  <img src="https://cdn.example.com/bag-1.jpg" width="600" height="600">
</div>
</body></html>
