<script>
// 알리식 호버 재렌더: mouseenter 시 .card-inner를 통째로 교체(호버 오버레이 추가) → 우리 버튼 파괴 재현.
document.querySelectorAll('.list-item').forEach(function (card) {
  card.addEventListener('mouseenter', function () {
    var inner = card.querySelector('.card-inner');
    if (!inner || inner.dataset.hovered === '1') return;
    inner.dataset.hovered = '1';
    var img = inner.querySelector('img.product-img');
    var src = img ? img.getAttribute('src') : '';
    var pid = card.getAttribute('data-product-id');
    var alt = img ? img.getAttribute('alt') : '';
    inner.innerHTML =
      '<a href="/item/' + pid + '.html"><img class="product-img" src="' + src + '" width="220" height="220" alt="' + alt + '"></a>' +
      '<div class="hover-overlay"><button>Add to Cart</button><button>Wishlist</button></div>' +
      '<div class="title">Wireless Earbuds Pro</div><div class="price">US $1x.30</div>';
  });
});
</script>
