<!doctype html>
<!-- 합성 구조 재현(정직) — 실제 아마존 캡처 아님. 오너 실기기 진단(B0CF88RN17: 색상 옵션값 "1", 갤러리
     _AC_US100_ 저해상, A+ 상세 __CR0,0,200,225_PT0_SX200__, 제목 꼬리 " : Home & Kitchen")의 tier2(트위스터 DOM)

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amazon.com: Foldable Storage Box : Home &amp; Kitchen</title>
</head>
<body>
  <div id="dp-container">
    <h1 id="title"><span id="productTitle">Foldable Storage Box with Lid, 2-Pack : Home &amp; Kitchen</span></h1>

    <div id="imgTagWrapperId">
      <img src="https://m.media-amazon.com/images/I/71aaa111._AC_US100_.jpg" width="500" height="500" alt="Foldable Storage Box main">
    </div>
    <div id="altImages">
      <img src="https://m.media-amazon.com/images/I/71aaa222._AC_US100_.jpg" width="40" height="40" alt="thumb 2">

    </div>

    <div id="corePriceDisplay_desktop_feature_div">
      <span class="a-price priceToPay"><span class="a-offscreen">$24.99</span></span>

    <!-- 색상 트위스터: 스와치 alt가 상품명이 아니라 인덱스 숫자로 들어온 실기기 상태 재현. -->
    <div id="inline-twister-row-color_name">
      <label class="a-form-label">Color:</label>
      <ul class="a-button-list">
        <li id="color_name_0"><img alt="1" src="https://m.media-amazon.com/images/I/31sw1._AC_US40_.jpg" width="30" height="30"></li>
        <li id="color_name_1"><img alt="2" src="https://m.media-amazon.com/images/I/31sw2._AC_US40_.jpg" width="30" height="30"></li>
      </ul>
    </div>

    <div id="inline-twister-row-size_name">
      <label class="a-form-label">Size:</label>
      <ul class="a-button-list">
        <li id="size_name_0"><img alt="Large" src="https://m.media-amazon.com/images/I/31sz1._AC_US40_.jpg" width="30" height="30"></li>
        <li id="size_name_1"><img alt="Medium" src="https://m.media-amazon.com/images/I/31sz2._AC_US40_.jpg" width="30" height="30"></li>
      </ul>
    </div>

    <div id="feature-bullets">
      <ul>
        <li><span class="a-list-item">접이식 수납상자 2개 세트, 뚜껑 포함</span></li>

      <img src="https://m.media-amazon.com/images/S/aplus-media/sc/apl-1.__CR0,0,200,225_PT0_SX200__.jpg" width="970" height="600" alt="A+ 1">
      <img src="https://m.media-amazon.com/images/S/aplus-media/sc/apl-2.__CR0,0,200,225_PT0_SX200__.jpg" width="970" height="600" alt="A+ 2">
      <img src="https://m.media-amazon.com/images/S/aplus-media/sc/apl-3.__CR0,0,200,225_PT0_SX200__.jpg" width="970" height="600" alt="A+ 3">
    </div>

    <div id="averageCustomerReviews">
      <span id="acrPopover" title="4.4 out of 5 stars"><span class="a-icon-alt">4.4 out of 5 stars</span></span>
    </div>
    <div id="cm-cr-dp-review-list">
      <div data-hook="review">
        <span class="a-profile-name">Jiyoon</span>
        <span data-hook="review-body">옷장 정리에 딱 맞아요. 접으면 자리를 거의 안 차지합니다.</span>
      </div>
      <div data-hook="review">
        <span class="a-profile-name">Minho</span>
        <span data-hook="review-body">뚜껑이 있어서 먼지가 안 들어옵니다. 두 개 사길 잘했어요.</span>
      </div>
      <div data-hook="review">
        <span class="a-profile-name">Sora</span>
        <span data-hook="review-body">가볍고 튼튼합니다. 색상은 사진보다 조금 밝아요.</span>
      </div>
    </div>
