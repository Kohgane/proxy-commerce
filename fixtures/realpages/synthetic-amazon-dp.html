<!doctype html>
<!-- 합성 픽스처(구조 재현) — 실제 아마존 캡처 아님. v70 STEP1/2/3 추출 검증용. -->
<html lang="en"><head>
<meta charset="utf-8">
<meta property="og:title" content="BENKS 3-in-1 무선 충전 스탠드 (15W 고속)">
<title>Amazon.com : BENKS 3-in-1 무선 충전 스탠드</title>
</head><body>
<h1><span id="productTitle">BENKS 3-in-1 무선 충전 스탠드 (15W 고속)</span></h1>

<!-- 갤러리: 메인(#imgTagWrapperId) + 썸네일(#altImages) -->
<div id="imgTagWrapperId">
  <img id="landingImage" src="https://m.media-amazon.com/images/I/MAIN._AC_SL500_.jpg"
    data-a-dynamic-image='{"https://m.media-amazon.com/images/I/MAIN._AC_SL1500_.jpg":[1500,1500],"https://m.media-amazon.com/images/I/MAIN._AC_SL500_.jpg":[500,500]}'>
</div>
<div id="altImages"><ul>
  <li><img src="https://m.media-amazon.com/images/I/T1._SS40_.jpg"></li>
  <li><img src="https://m.media-amazon.com/images/I/T2._SS40_.jpg"></li>
  <li><img src="https://m.media-amazon.com/images/I/T3._SS40_.jpg"></li>
  <li><img src="https://m.media-amazon.com/images/I/T4._SS40_.jpg"></li>
  <li><img src="https://m.media-amazon.com/images/I/sprite-video-icon.png"></li>
</ul></div>

<!-- 관련상품(스코프 밖) — 갤러리에 혼입되면 안 됨 -->
<div id="sims-consolidated-2_feature_div">
  <img src="https://m.media-amazon.com/images/I/REL1.jpg">
  <img src="https://m.media-amazon.com/images/I/REL2.jpg">
</div>

<!-- buybox 현재가 29.99 -->
<div id="corePrice_desktop"><span class="a-price priceToPay"><span class="a-offscreen">$29.99</span></span></div>
<!-- 광고 위젯 정가 32.99 (a-text-price) — 채택되면 안 됨 -->
<div id="sims-consolidated-3_feature_div"><span class="a-price a-text-price"><span class="a-offscreen">$32.99</span></span></div>

<!-- 트위스터 색상 4값 -->
<div id="inline-twister-row-color_name">
  <span class="a-form-label">Color:</span>
  <ul class="a-button-list">
    <li id="color_name_0"><img alt="Black"></li>
    <li id="color_name_1"><img alt="Navy"></li>
    <li id="color_name_2"><img alt="Red"></li>
    <li id="color_name_3"><img alt="Green"></li>
  </ul>
</div>

<!-- 수량 드롭다운 — 옵션 아님 -->
<select id="quantity" aria-label="Quantity">
  <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
  <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
</select>

<!-- 상세(About this item) -->
<div id="feature-bullets"><ul>
  <li><span class="a-list-item">15W 고속 무선 충전 지원</span></li>
  <li><span class="a-list-item">아이폰·에어팟·애플워치 동시 충전</span></li>
  <li><span class="a-list-item">미끄럼 방지 실리콘 패드</span></li>
</ul></div>
</body></html>
