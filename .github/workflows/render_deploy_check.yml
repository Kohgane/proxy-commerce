name: Render — Docker Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build-check:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: proxy-commerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name pc-ci \
            -p 10000:10000 \
            -e PORT=10000 \
            -e APP_ENV=ci \
            -e FX_DISABLE_NETWORK=1 \
            proxy-commerce:ci
          echo "Container started, waiting for health..."

      - name: Verify operational scripts in image (v87-W1 아티팩트 게이트 · 완료조건 5항)
        run: |
          echo "== /app/scripts contents (배포 이미지 실증) =="
          docker exec pc-ci ls -1 /app/scripts/
          missing=0
          for f in hygiene_report.py qa_test_order.py migrate_to_supabase.py start_render.sh; do
            if docker exec pc-ci test -f /app/scripts/$f; then
              echo "✓ /app/scripts/$f present"
            else
              echo "✗ /app/scripts/$f MISSING in deploy image"; missing=1
            fi
          done
          # 개발 전용 devshot는 명시 제외됐어야 한다(암묵 제외 금지 — 이미지에 새지 않음).
          if docker exec pc-ci sh -c 'ls /app/scripts/_devshot*.py >/dev/null 2>&1'; then
            echo "✗ dev-only _devshot*.py leaked into deploy image"; missing=1
          else
            echo "✓ dev-only devshots explicitly excluded from image"
          fi
          exit $missing

      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:10000/health; then
              echo ""
              echo "✓ Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/15 — waiting 4s..."
            sleep 4
          done
          echo "✗ Health check failed after 15 attempts"
          docker logs pc-ci
          exit 1

      - name: Run smoke tests
        run: |
          python scripts/render_smoke.py http://localhost:10000

      - name: Show container logs (on failure)
        if: failure()
        run: docker logs pc-ci

      - name: Cleanup
        if: always()
        run: docker rm -f pc-ci || true
