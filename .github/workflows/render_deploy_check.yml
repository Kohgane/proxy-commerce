name: Render — Docker Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build-check:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: proxy-commerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Measure image size (D3-3 — 전후 숫자를 사람이 읽게)
        run: |
          echo "== 배포 이미지 크기 =="
          docker image inspect proxy-commerce:ci --format '{{.Size}}' \
            | awk '{printf "image_size_bytes=%d (%.0f MB)\n", $1, $1/1024/1024}'
          echo "== 파이썬 패키지 상위 10 (무엇이 크기를 차지하나) =="
          docker run --rm proxy-commerce:ci sh -c \
            'du -sm /usr/local/lib/python3.11/site-packages/* 2>/dev/null | sort -rn | head -10'

      - name: Start container
        run: |
          START=$(date +%s.%N)
          docker run -d \
            --name pc-ci \
            -p 10000:10000 \
            -e PORT=10000 \
            -e APP_ENV=ci \
            -e FX_DISABLE_NETWORK=1 \
            proxy-commerce:ci
          echo "$START" > /tmp/pc_start_ts
          echo "Container started, waiting for health..."

      - name: Verify D3-3 render font in image (F43 동류 — 레포엔 있는데 이미지엔 없다)
        run: |
          # 폰트가 이미지에 없으면 3단계 한글이 두부(□□□)로 나간다. 존재 + 크기(서브셋 아님)를 잰다.
          docker exec pc-ci ls -l /app/assets/fonts/
          docker exec pc-ci test -f /app/assets/fonts/NotoSansKR-VF.ttf \
            || { echo "✗ 렌더 폰트 MISSING in deploy image"; exit 1; }
          SZ=$(docker exec pc-ci stat -c %s /app/assets/fonts/NotoSansKR-VF.ttf)
          echo "font_bytes=$SZ"
          # 서브셋이면 수백 KB로 떨어진다 — 5MB 미만이면 서브셋을 의심한다.
          [ "$SZ" -gt 5000000 ] || { echo "✗ 폰트가 너무 작다 — 서브셋 의심($SZ)"; exit 1; }
          docker exec pc-ci python -c "import cv2, numpy; print('cv2', cv2.__version__, 'numpy', numpy.__version__)"

      - name: Verify operational scripts in image (v87-W1 아티팩트 게이트 · 완료조건 5항)
        run: |
          echo "== /app/scripts contents (배포 이미지 실증) =="
          docker exec pc-ci ls -1 /app/scripts/
          missing=0
          for f in hygiene_report.py qa_test_order.py persistence_check.py migrate_to_supabase.py start_render.sh; do
            if docker exec pc-ci test -f /app/scripts/$f; then
              echo "✓ /app/scripts/$f present"
            else
              echo "✗ /app/scripts/$f MISSING in deploy image"; missing=1
            fi
          done
          # 개발 전용 devshot는 명시 제외됐어야 한다(암묵 제외 금지 — 이미지에 새지 않음).
          if docker exec pc-ci sh -c 'ls /app/scripts/_devshot*.py >/dev/null 2>&1'; then
            echo "✗ dev-only _devshot*.py leaked into deploy image"; missing=1
          else
            echo "✓ dev-only devshots explicitly excluded from image"
          fi
          exit $missing

      - name: Verify pilot static data in image (v88-C 파일럿 · #423 동류 재발방지)
        run: |
          echo "== /app/data contents (배포 이미지 실증) =="
          docker exec pc-ci ls -1 /app/data/ || true
          missing=0
          for f in sourcing_map.json pilot_population.json; do
            if docker exec pc-ci test -f /app/data/$f; then
              echo "✓ /app/data/$f present"
            else
              echo "✗ /app/data/$f MISSING — /admin/coupang-pilot 400 근원"; missing=1
            fi
          done
          exit $missing

      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:10000/health; then
              echo ""
              # D3-3 — 기동 시간. 앞선 검증 스텝이 낀 뒤라 **상한**이지 순수 부팅 시간은 아니다.
              #   (cv2·numpy는 함수 안 import라 부팅 경로에 없다 — 실측 근거는 PR 본문.)
              NOW=$(date +%s.%N); START=$(cat /tmp/pc_start_ts 2>/dev/null || echo "$NOW")
              awk -v a="$START" -v b="$NOW" 'BEGIN{printf "boot_to_health_upper_bound=%.1fs\n", b-a}'
              echo "✓ Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/15 — waiting 4s..."
            sleep 4
          done
          echo "✗ Health check failed after 15 attempts"
          docker logs pc-ci
          exit 1

      - name: Run smoke tests
        run: |
          python scripts/render_smoke.py http://localhost:10000

      - name: Show container logs (on failure)
        if: failure()
        run: docker logs pc-ci

      - name: Cleanup
        if: always()
        run: docker rm -f pc-ci || true
