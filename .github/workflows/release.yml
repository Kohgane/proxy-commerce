name: Auto Release
on:
  push:
    tags:
      - 'v*'
  # v88-A: 태그 push 권한 없는 경로(에이전트/프록시)에서도 릴리즈를 낼 수 있도록 수동 디스패치 지원.
  #   version 입력으로 태그명을 받아, gh release create --target <sha> 가 그 커밋에 태그+릴리즈를 만든다.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (예: v1.5.149) — manifest 버전과 일치 권장'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate changelog
        id: changelog
        run: |
          python scripts/generate_changelog.py > CHANGELOG_RELEASE.md
          echo "Generated changelog:"
          cat CHANGELOG_RELEASE.md
      # v88-A: 크롬 웹스토어 제출용 확장 zip을 릴리즈에 첨부 → 오너가 GitHub 로그인으로 Releases에서 다운.
      - name: Build extension zip (store submission)
        run: |
          mkdir -p dist
          python scripts/build_extension_zip.py "dist/gogabridj-collector-${{ steps.tag.outputs.name }}.zip"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "Release ${{ steps.tag.outputs.name }}" \
            --notes-file CHANGELOG_RELEASE.md \
            --target "${{ github.sha }}" \
            "dist/gogabridj-collector-${{ steps.tag.outputs.name }}.zip"
