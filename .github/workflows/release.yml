name: Auto Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate changelog
        id: changelog
        run: |
          python scripts/generate_changelog.py > CHANGELOG_RELEASE.md
          echo "Generated changelog:"
          cat CHANGELOG_RELEASE.md
      # v88-A: 크롬 웹스토어 제출용 확장 zip을 릴리즈에 첨부 → 오너가 GitHub 로그인으로 Releases에서 다운.
      - name: Build extension zip (store submission)
        run: |
          mkdir -p dist
          python scripts/build_extension_zip.py "dist/gogabridj-collector-${{ github.ref_name }}.zip"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file CHANGELOG_RELEASE.md \
            "dist/gogabridj-collector-${{ github.ref_name }}.zip"
