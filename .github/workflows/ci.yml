name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # v84 STEP1: 실브라우저 하네스가 CI에서 **실제로 돌게** 한다. 예전엔 브라우저가 없어 항상 skip이었고,
      #   그래서 "값 계약 그린 + 화면엔 버튼 없음" 상태가 통과했다(오너 실기기 사고의 구조적 원인).
      - name: Chromium 설치(실브라우저 하네스용)
        run: python -m playwright install --with-deps chromium

      - name: 충돌 마커 검출
        run: |
          found=0
          for d in src tests templates static; do
            if [ -d "$d" ]; then
              if grep -rnE '^(<{7}|={7}|>{7})( |$)' "$d"; then
                found=1
              fi
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::머지 충돌 마커 발견"
            exit 1
          fi

      - name: Python syntax 사전 컴파일
        run: python -m compileall src/ -q

      - name: pytest collect clean
        run: python -m pytest --collect-only -q

      # v84 STEP1: 주입 사활 계약은 --collect-only로는 못 잡는다(assert가 안 돈다) → 이 두 파일만 실제 실행.
      #   전건 pytest는 여전히 배포 워크플로 몫이지만, "화면에 버튼이 없는" 회귀만큼은 PR에서 막는다.
      - name: 주입 사활 계약 실행(실브라우저 포함)
        run: python -m pytest tests/test_v84_injection_harness.py tests/test_v86_shadow_visibility.py tests/test_v70_realpage_harness.py -q

  # v86-K: 전체 스위트 필수 게이트 — collect-only 사각(v86-H2에서 23 레드 은닉)을 봉인한다.
  #   KGP_REQUIRE_BROWSER=1 → 브라우저/노드/jsdom/Pillow 인프라 부재로 인한 skip은 **실패**로 전환(조용한
  #   skip 금지). 인메모리 레인(기본): 브라우저/노드/jsdom/Pillow 전부 붙여 실행. PG 계약은 아래 pg-suite에서
  #   따로 돈다(전역 DATABASE_URL은 앱을 PG 모드로 바꿔 인메모리 가정 다수를 깨므로 레인 분리 필수).
  full-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KGP_REQUIRE_BROWSER: "1"
      # ★핵심(v86-K 실측): 실페이지 하네스가 브라우저를 `/opt/pw-browsers/chromium-*/chrome-linux/chrome`
      #   글롭으로 찾는다(샌드박스 관행). CI 기본 설치 경로(~/.cache)면 글롭 실패 → 종전엔 조용히 skip
      #   (=CI에서 브라우저 계약이 한 번도 안 돌던 v86-H2 사각의 실체). 설치 경로를 글롭 대상으로 고정.
      PLAYWRIGHT_BROWSERS_PATH: "/opt/pw-browsers"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install "Pillow>=10"            # 아이콘/OG 빌드 계약(스테일 skip 방지)
          npm install jsdom --no-save         # jsdom 하네스(node -e require('jsdom'))

      - name: Chromium 설치(/opt/pw-browsers = 하네스 탐색 대상)
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown -R "$(id -un)" /opt/pw-browsers
          python -m playwright install --with-deps chromium
          # 실존 확인은 **Playwright 자체 해석기**로 한다(권위 소스). 하드코딩 글롭
          #   (chrome-linux/chrome)은 최신 Playwright의 Chrome-for-Testing 레이아웃
          #   (chrome-linux64/chrome)에서 빗나가 거짓 실패를 낸다. 하네스도 executable_path로
          #   폴백하므로 여기서도 같은 기준으로 '설치 실존'만 못박는다(없으면 즉시 실패).
          python - <<'PY'
          import sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              exe = Path(pw.chromium.executable_path)
          print("chromium executable_path:", exe)
          if not exe.exists():
              print("::error::PLAYWRIGHT_BROWSERS_PATH에 chromium 실행파일 없음 — 설치 누수")
              sys.exit(1)
          PY

      - name: 전체 스위트(인메모리 레인) 실행 — KGP_REQUIRE_BROWSER=1 · 인프라 skip 0
        run: |
          set -o pipefail
          # PG 전용 계약은 pg-suite 잡으로 분리(인메모리 앱에선 skip 대상) → 여기선 ignore.
          python -m pytest tests/ -q -ra -p no:cacheprovider \
            --ignore=tests/test_v45_migrate_reconcile.py \
            --ignore=tests/test_v45_supabase_backup.py \
            --ignore=tests/test_v45_supabase_stage1.py \
            --ignore=tests/test_v45_supabase_stage2.py \
            --ignore=tests/test_v45_supabase_stage3.py \
            --ignore=tests/test_v45_token_bulk_delete.py \
            --ignore=tests/test_v49_db_metering.py \
            --ignore=tests/test_v88_b_impl_translation_jobs.py \
            2>&1 | tee /tmp/pytest_full.txt
          echo "----- 요약(pass/fail/skip) -----"; tail -1 /tmp/pytest_full.txt
          # 인프라 skip 0 강제: KGP_REQUIRE_BROWSER=1이 인프라 skip을 실패로 전환하므로 여기서 SKIPPED로 남는
          #   건 로직 skip('계약 대상 없음' 류)뿐이어야 한다. 인프라 패턴 SKIPPED가 있으면 게이트 실패(이중 안전).
          if grep -E "^SKIPPED" /tmp/pytest_full.txt | grep -qiE "Playwright|chromium|node 미설치|jsdom|Pillow|브라우저"; then
            echo "::error::인프라 skip 잔존 — 브라우저/노드/jsdom/Pillow 설치가 새는 지점 있음"; exit 1
          fi

  # v86-K: PG 계약 레인 — Postgres 서비스 + DATABASE_URL로 Supabase 이관 계약만 격리 실행(인메모리 레인과
  #   상호배타). 두 잡의 합집합이 전 계약을 커버 → CI 전체에서 조용한 skip 0.
  pg-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goga
          POSTGRES_PASSWORD: goga
          POSTGRES_DB: gogadb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: "postgresql://goga:goga@localhost:5432/gogadb"
      SUPABASE_DB_URL: "postgresql://goga:goga@localhost:5432/gogadb"
      DATABASE_URL_DIRECT: "postgresql://goga:goga@localhost:5432/gogadb"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: PG 이관 계약 실행(격리 레인)
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_v45_migrate_reconcile.py \
            tests/test_v45_supabase_backup.py \
            tests/test_v45_supabase_stage1.py \
            tests/test_v45_supabase_stage2.py \
            tests/test_v45_supabase_stage3.py \
            tests/test_v45_token_bulk_delete.py \
            tests/test_v49_db_metering.py \
            tests/test_v88_b_impl_translation_jobs.py \
            2>&1 | tee /tmp/pytest_pg.txt
          tail -1 /tmp/pytest_pg.txt

  # v83.1 STEP2: 머지 전 실기기 검증 경로 상설화 — 브랜치 빌드 확장 ZIP을 PR 아티팩트로 뽑는다.
  #   오너가 배포(/seller/extension/download) 없이도 PR에서 바로 받아 재로딩 → 실기기 재진단 가능.
  #   ZIP 안 build-info.json에 커밋 해시가 각인되고, 확장 진단 파일이 그 값을 실어 준다
  #   → 채팅 채점이 "이게 브랜치 빌드인가"를 버전 문자열이 아니라 커밋으로 즉판한다.
  extension-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 확장 ZIP 빌드(커밋 각인)
        # PR 이벤트의 기본 GITHUB_SHA는 GitHub이 만든 **머지 커밋**이라 오너가 브랜치에서 보는 해시와 다르다
        #   → 각인이 "내 브랜치 빌드"임을 못 알아보게 된다. GITHUB_* 는 예약 이름이라 덮어쓸 수 없으므로
        #   (설정해도 무시된다) 전용 오버라이드 키로 head SHA·브랜치명을 넘긴다.
        env:
          KGP_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          KGP_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python scripts/build_extension_zip.py dist/gogasujipgi-branch.zip
          python - <<'PY'
          import json, sys, zipfile
          z = zipfile.ZipFile("dist/gogasujipgi-branch.zip")
          names = set(z.namelist())
          info = json.loads(z.read("build-info.json"))
          # manifest가 선언한 content_scripts js가 전부 ZIP에 들어갔는지(설치 즉시 깨지는 누락 방지).
          mani = json.loads(z.read("manifest.json"))
          need = {j for cs in mani.get("content_scripts", []) for j in cs.get("js", [])}
          need |= {mani.get("background", {}).get("service_worker", "")} - {""}
          missing = sorted(n for n in need if n not in names)
          if missing:
              print(f"::error::ZIP에 manifest 선언 스크립트 누락: {missing}")
              sys.exit(1)
          if not info.get("commit"):
              print("::error::build-info.json에 커밋 각인 없음")
              sys.exit(1)
          print(f"확장 ZIP OK — version={info['version']} commit={info['commit_short']} files={len(names)}")
          PY

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: gogasujipgi-extension
          path: dist/gogasujipgi-branch.zip
          retention-days: 30
