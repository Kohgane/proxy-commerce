<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나이아 레일 — 정답지</title>
<style>
:root{--ink:#1A1714;--hanji:#F5EFE3;--paper:#FBF8F1;--gold:#C9A24B;--teal:#119A8E;--muted:#8A8275;--line:#E6DECB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
header{position:sticky;top:0;background:rgba(251,248,241,.9);backdrop-filter:blur(12px);padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;z-index:5}
.list{padding:0 64px 60px 0}
.sec{position:sticky;top:49px;background:var(--hanji);color:var(--muted);font-weight:800;font-size:13px;padding:6px 18px;border-bottom:1px solid var(--line);z-index:4}
.row{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:56px;border-bottom:1px solid var(--line)}
.row .ic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--hanji),#fff);border:1px solid var(--line);flex:none}
.row b{font-size:16px;font-weight:600}
/* ── 나이아 레일: 항상 우측 고정 ── */
#rail{position:fixed;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;z-index:10;padding:6px 2px;user-select:none;touch-action:none}
#rail span{font-size:10.5px;line-height:1.35;font-weight:700;color:var(--muted);width:26px;text-align:center;cursor:pointer}
#rail span.on{color:var(--teal);transform:scale(1.25)}
#rail span.dim{opacity:.28}
#bubble{position:fixed;right:44px;width:74px;height:74px;border-radius:22px;background:var(--ink);color:var(--hanji);display:none;align-items:center;justify-content:center;font-size:34px;font-weight:900;z-index:11;box-shadow:0 10px 30px rgba(26,23,20,.35)}
@media(hover:hover){#rail span:hover{color:var(--teal);transform:scale(1.3)}}
</style></head><body>
<header>내 상품 <span style="color:var(--muted);font-weight:500;font-size:13px">— 나이아 레일 정답지</span></header>
<div class="list" id="list"></div>
<div id="rail"></div><div id="bubble"></div>
<script>
const KO="ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ".split(""), EN="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""), ALL=[...KO,...EN,"#"];
// 데모 데이터(빈 초성도 일부러 둠 — dim 확인용)
const demo={"ㄱ":["가죽 접이식 책상","고가 브릿지 토트"],"ㄴ":["나무 트레이"],"ㄷ":["다다미 소파"],"ㅁ":["멀티탭 3구","무선충전 스탠드"],"ㅂ":["보조배터리 5000"],"ㅅ":["사이드테이블","소파 쿠션","숄더백"],"ㅇ":["올인홈 각도조절 테이블","우드 랜턴"],"ㅈ":["접이식 차량용 책상"],"ㅊ":["차량용 거치대"],"ㅍ":["폴딩 테이블"],"ㅎ":["홈 무드등"],"A":["Aroma Diffuser"],"B":["Bridge Lamp"],"G":["Grat 4 Grip Stand","Grat 5 Grip"],"M":["MagSafe Ring","MOFT Stand"],"O":["OHSNAP Adhesive"],"P":["PopSockets Grip"],"T":["Tango Grip"],"#":["3in1 충전패드"]};
const list=document.getElementById("list"), rail=document.getElementById("rail"), bub=document.getElementById("bubble");
ALL.forEach(ch=>{
  const has=demo[ch]&&demo[ch].length;
  const sec=document.createElement("div"); sec.className="sec"; sec.id="sec-"+ch; sec.textContent=ch;
  list.appendChild(sec);
  (demo[ch]||[]).forEach(n=>{const r=document.createElement("div");r.className="row";r.innerHTML='<span class="ic"></span><b>'+n+"</b>";list.appendChild(r)});
  if(!has){const r=document.createElement("div");r.className="row";r.style.opacity=.35;r.innerHTML='<span style="font-size:13px;color:var(--muted)">아직 없음</span>';list.appendChild(r)}
  const s=document.createElement("span"); s.textContent=ch; if(!has)s.classList.add("dim");
  s.dataset.ch=ch; rail.appendChild(s);
});
function jump(ch,clientY){
  const t=document.getElementById("sec-"+ch); if(t) t.scrollIntoView({block:"start"});
  [...rail.children].forEach(x=>x.classList.toggle("on",x.dataset.ch===ch));
  bub.textContent=ch; bub.style.display="flex";
  bub.style.top=Math.min(Math.max((clientY||innerHeight/2)-37,80),innerHeight-120)+"px";
  clearTimeout(bub._t); bub._t=setTimeout(()=>bub.style.display="none",600);
}
function pick(e){
  const y=e.touches?e.touches[0].clientY:e.clientY;
  const el=document.elementFromPoint(rail.getBoundingClientRect().left+13,y);
  if(el&&el.dataset&&el.dataset.ch) jump(el.dataset.ch,y);
}
rail.addEventListener("touchstart",pick); rail.addEventListener("touchmove",pick);
rail.addEventListener("mousedown",e=>{pick(e);const mv=ev=>pick(ev),up=()=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up)};addEventListener("mousemove",mv);addEventListener("mouseup",up)});
rail.addEventListener("click",pick);
</script></body></html>
