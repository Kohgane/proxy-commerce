{# M6(오너 2026-10-08) — 마켓 상태 팝업. 목록 칩·등록됨 배지·폰 카드 「검토 상태 보기」가 같은 팝업을 연다.
   데이터: GET /seller/collect/<id>/market-status?phase=db|status[&market=…] — M8: ① db = 등록 기록만(즉시)
   ② status = 마켓별 병렬·12초 상한(60초 캐시). 한 페이지에 한 번만 넣는다. #}
<dialog class="mst" id="kgpMarketStatus" data-role="market-status" aria-labelledby="mstTitle">
  <div class="mst-head">
    <h2 class="mst-title" id="mstTitle">마켓 상태</h2>
    <button type="button" class="mst-x" data-role="mst-close" aria-label="닫기">닫기</button>
  </div>
  <div class="mst-body" data-role="mst-body">불러오는 중…</div>
</dialog>
<style>
  .mst { width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--border);
         border-radius: var(--radius-lg); background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); }
  .mst::backdrop { background: color-mix(in srgb, var(--ink) 45%, transparent); }
  .mst-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .mst-title { font-family: var(--font-display); font-size: 1.15rem; margin: 0; }
  .mst-x { min-height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--text); white-space: nowrap; }
  .mst-body { padding: 12px 16px 16px; overflow-y: auto; }
  .mst-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .mst-row:last-child { border-bottom: 0; }
  .mst-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600; }
  .mst-badge { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; white-space: nowrap;
               background: color-mix(in srgb, var(--text-muted) 16%, transparent); color: var(--text); }
  .mst-badge.is-ok { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .mst-badge.is-bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .mst-badge.is-fail { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange-strong, var(--orange)); }
  .mst-badge.is-pending { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); font-weight: 500; }
  .mst-retry-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mst-retry { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--ink); border-radius: 999px;
               background: transparent; color: var(--text); font-weight: 600; white-space: nowrap; }
  .mst-meta { font-size: .85rem; color: var(--text-muted); margin-top: 4px; overflow-wrap: anywhere; }
  .mst-reason { margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--danger); background: var(--bg); overflow-wrap: anywhere; }
  .mst-err { margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--orange); background: var(--bg); font-size: .85rem; overflow-wrap: anywhere; }
  .mst-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .mst-resend { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px;
                background: var(--ink); color: var(--hanji, var(--surface)); font-weight: 600; white-space: nowrap; }
  .mst-resend:disabled { opacity: .6; }
  .mst-dup-remove { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--orange);
                    border-radius: 999px; background: transparent; color: var(--orange-strong, var(--orange)); white-space: nowrap; }
  .mst-ok { color: var(--success); }
  .mst-links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; color: var(--teal); text-decoration: none; white-space: nowrap; }
</style>
<script>
(function () {
  var dlg = document.getElementById('kgpMarketStatus');
  if (!dlg || dlg.dataset.ready) return;
  dlg.dataset.ready = '1';
  var body = dlg.querySelector('[data-role=mst-body]');
  var TONE = {ok: 'is-ok', bad: 'is-bad', fail: 'is-fail', wait: ''};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function kst(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return iso;
    var k = new Date(d.getTime() + 9 * 3600 * 1000);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return (k.getUTCMonth() + 1) + '-' + p(k.getUTCDate()) + ' ' + p(k.getUTCHours()) + ':' + p(k.getUTCMinutes()) + ' KST';
  }
  function row(r) {
    // M8: 1단(DB)은 상태가 오기 전 — 마지막으로 알던 값이 있으면 그것(흐리게), 없으면 「상태 확인 중…」
    var badge = r.pending ? (r.label ? r.label + ' · 확인 중…' : '상태 확인 중…') : (r.label || '확인 못 함');
    var h = '<div class="mst-row" data-role="mst-row" data-market="' + esc(r.market) + '" data-pid="' + esc(r.product_id) + '" data-state="' + esc(r.state) + '"' +
      (r.pending ? ' data-pending="1"' : '') + '>' +
      '<div class="mst-top"><span>' + esc(r.market_label || r.chip) + '</span>' +
      '<span class="mst-badge ' + (r.pending ? 'is-pending' : (TONE[r.tone] || '')) + '" data-role="mst-state">' + esc(badge) + '</span></div>' +
      '<div class="mst-meta">' + (r.channel_product_no || String(r.market || '').indexOf('smartstore') === 0
        // 오너 2026-10-10: 네이버는 **채널 상품번호만** 보인다(원상품번호는 로그·DB 내부용)
        ? '상품번호 ' + esc(r.channel_product_no || '확인 중')
        : '상품번호 ' + esc(r.product_id || '없음')) + (r.registered_at ? ' · 등록 ' + esc(kst(r.registered_at)) : '') +
      (r.status_raw ? ' · 마켓 표기 「' + esc(r.status_raw) + '」' : '') +
      (r.checked_at ? ' · 확인 ' + esc(kst(r.checked_at)) + (r.cached ? '(1분 안에 다시 묻지 않아요)' : '') : '') + '</div>';
    if (r.dup_count) h += '<div class="mst-err" data-role="mst-dup">같은 상품이 이 마켓에 ' + r.dup_count + '건 있어요 — 남길 번호를 정하고, 나머지는 판매자센터에서 지운 뒤 「이 기록 빼기」</div>';
    if (r.comment) h += '<div class="mst-reason" data-role="mst-reason"><b>반려 사유</b> ' + esc(r.comment) + '</div>';
    // M8-8: 등록 때 쓴 재료(마진·환율·수수료) — 지금 다시 낸 줄과 다르면 무엇이 달랐는지 바로 보인다
    if (r.registered_price) h += '<div class="mst-meta" data-role="mst-price-registered">등록 때 판매가 구성: ' + esc(r.registered_price) + '</div>';
    if (r.price_line) h += '<div class="mst-meta" data-role="mst-price-line">' + (r.registered_price ? '지금 다시 내면: ' : '판매가 구성: ') + esc(r.price_line) + '</div>';
    if (r.error) h += '<div class="mst-err" data-role="mst-error">상태 확인 실패 — ' + esc(r.error) + '</div>';
    var links = '';
    if (r.manage_url) links += '<a href="' + esc(r.manage_url) + '" target="_blank" rel="noopener" data-role="mst-manage">' + esc(r.manage_label || '마켓에서 열기') + '</a>';
    if (r.link) links += '<a href="' + esc(r.link) + '" target="_blank" rel="noopener" data-role="mst-link">구매자 화면</a>';
    // Y7-J: 네이버 등록본 — 상세 본문만 지금 규칙(사진 위·글 아래·상표 제거)으로 다시 보낸다(가격·옵션·사진 칸은 그대로)
    // Y7-K: 같은 마켓 2건 이상 — 그중 하나를 우리 기록에서 뺀다(마켓 상품 삭제는 판매자센터에서)
    if (r.dup_count && r.product_id)
      links += '<button type="button" class="mst-dup-remove" data-role="mst-dup-remove" data-market="' + esc(r.market) + '" data-pid="' + esc(r.product_id) + '">이 기록 빼기</button>';
    // M8-7: 기록이 하나뿐이어도 **다시 등록하려면** 뺄 수 있다(두 번 눌러야 빠짐 · 마켓의 상품은 그대로 — 판매자센터에서)
    else if (r.product_id)
      links += '<button type="button" class="mst-dup-remove" data-role="mst-dup-remove" data-single="1" data-market="' + esc(r.market) + '" data-pid="' + esc(r.product_id) + '">기록 빼기(다시 등록용)</button>';
    if (String(r.market || '').indexOf('smartstore') === 0 && r.product_id)
      links += '<button type="button" class="mst-resend" data-role="mst-resend" data-market="' + esc(r.market) + '">본문 다시 보내기</button>';
    if (links) h += '<div class="mst-links">' + links + '</div>';
    if (String(r.market || '').indexOf('smartstore') === 0)
      h += '<div class="mst-meta" data-role="mst-resend-out" hidden></div>';
    return h + '</div>';
  }
  var curItem = '';
  function resend(btn) {
    var rowEl = btn.closest('[data-role=mst-row]');
    var out = rowEl && rowEl.querySelector('[data-role=mst-resend-out]');
    btn.disabled = true; btn.textContent = '보내는 중…';
    if (out) { out.hidden = false; out.textContent = '본문을 다시 만들고 네이버에 보내는 중…'; }
    fetch('/seller/collect/' + encodeURIComponent(curItem) + '/naver-resend-detail', {
      method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({market: btn.getAttribute('data-market')})
    }).then(function (r) { return r.text().then(function (t) {
      try { return JSON.parse(t); } catch (e) { return {ok: false, error: '응답을 읽지 못했어요 (HTTP ' + r.status + ')'}; } }); })
      .then(function (d) {
        btn.disabled = false; btn.textContent = '본문 다시 보내기';
        if (!out) return;
        var bits = [];
        if (d && d.ok) bits.push(esc(d.message || '보냈어요'));
        else bits.push('보내지 못했어요 — ' + esc((d && d.error) || '사유 미상'));
        if (d && d.marks) bits.push(esc(d.marks));
        if (d && d.dropped && d.dropped.length) bits.push('못 올린 사진 ' + d.dropped.length + '장 — ' + esc(d.dropped[0].reason || ''));
        if (d && d.auto && d.auto.draft_status === 'openai_error') bits.push('AI 호출 실패 — 확인된 정보로 정리한 글: ' + esc(d.auto.draft_error || ''));
        out.innerHTML = bits.join('<br>');
        out.className = 'mst-meta ' + (d && d.ok ? 'mst-ok' : 'mst-err');
      }).catch(function (e) { btn.disabled = false; btn.textContent = '본문 다시 보내기';
        if (out) { out.className = 'mst-err'; out.textContent = '네트워크 오류 — ' + ((e && e.message) || e); } });
  }
  // M8(오너 2026-10-10 22:13 폰 Safari): 2단 — ① DB만으로 즉시(번호·링크·「본문 다시 보내기」) ② 마켓 상태(병렬·12초 상한)로 칸만 채움.
  //   폰 망 전환 중 fetch가 끊겨도 팝업은 닫히지 않고, 그 자리에 「다시 시도」 한 줄.
  var curMarket = '', seq = 0;
  function getJSON(url) {
    return fetch(url, {credentials: 'same-origin'}).then(function (r) {
      return r.text().then(function (t) {
        try { return JSON.parse(t); } catch (e) { return {ok: false, error: '응답을 읽지 못했어요 (HTTP ' + r.status + ')'}; }
      });
    });
  }
  function msUrl(phase) {
    return '/seller/collect/' + encodeURIComponent(curItem) + '/market-status?phase=' + phase +
      (curMarket ? '&market=' + encodeURIComponent(curMarket) : '');
  }
  function retryLine(role, msg) {
    return '<div class="mst-err mst-retry-line" data-role="' + role + '">' + esc(msg) +
      ' <button type="button" class="mst-retry" data-role="mst-retry">다시 시도</button></div>';
  }
  function swapRow(oldEl, html) {
    var tmp = document.createElement('div'); tmp.innerHTML = html;
    var nu = tmp.firstElementChild;
    // 누르는 중이거나 결과가 뜬 「본문 다시 보내기」는 그대로 옮겨 심는다(상태가 와도 결과 줄이 사라지지 않게)
    ['mst-resend', 'mst-resend-out'].forEach(function (role) {
      var o = oldEl.querySelector('[data-role=' + role + ']'), n = nu.querySelector('[data-role=' + role + ']');
      if (o && n) n.replaceWith(o);
    });
    oldEl.replaceWith(nu);
  }
  function loadStatus(my) {
    var old = body.querySelector('[data-role=mst-status-fail]'); if (old) old.remove();
    return getJSON(msUrl('status')).then(function (d) {
      if (my !== seq) return d;
      if (!d || !d.ok) throw new Error((d && d.error) || '상태를 받지 못했어요');
      (d.rows || []).forEach(function (r) {
        var el = body.querySelector('[data-role=mst-row][data-market="' + r.market + '"][data-pid="' + (r.product_id || '') + '"]');
        if (el) swapRow(el, row(r)); else body.insertAdjacentHTML('beforeend', row(r));
      });
      document.dispatchEvent(new CustomEvent('kgp:market-status', {detail: {itemId: curItem, rows: d.rows || []}}));
      return d;
    }).catch(function (e) {
      if (my !== seq) return;
      [].forEach.call(body.querySelectorAll('[data-role=mst-row][data-pending] [data-role=mst-state]'), function (b) {
        b.textContent = '상태 확인 실패'; b.className = 'mst-badge is-fail'; });
      body.insertAdjacentHTML('afterbegin', retryLine('mst-status-fail', '마켓 상태를 받지 못했어요 — ' + ((e && e.message) || e) + ' · 아래 번호·버튼은 그대로 쓸 수 있어요.'));
    });
  }
  function load() {
    var my = ++seq;
    body.innerHTML = '<p class="mst-meta" data-role="mst-loading">등록 기록을 불러오는 중…</p>';
    return getJSON(msUrl('db')).then(function (d) {
      if (my !== seq) return d;
      if (!d || !d.ok) throw new Error((d && d.error) || '불러오지 못했어요');
      if (!(d.rows || []).length) { body.innerHTML = '<p data-role="mst-empty">' + esc(d.message || '등록 기록이 없어요.') + '</p>'; return d; }
      body.innerHTML = d.rows.map(row).join('');
      return loadStatus(my);
    }).catch(function (e) {
      if (my !== seq) return;
      body.innerHTML = retryLine('mst-error', '불러오지 못했어요 — ' + ((e && e.message) || e));
    });
  }
  window.kgpMarketStatus = function (itemId, market) {
    curItem = itemId; curMarket = market || '';
    if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
    return load();
  };
  dlg.addEventListener('click', function (ev) {
    var rt = ev.target.closest && ev.target.closest('[data-role=mst-retry]');
    if (rt) {
      ev.preventDefault();
      // DB 단계가 안 됐으면 처음부터, 됐으면 상태만 다시
      if (body.querySelector('[data-role=mst-row]')) loadStatus(seq); else load();
      return;
    }
    var rs = ev.target.closest && ev.target.closest('[data-role=mst-resend]');
    if (rs) { ev.preventDefault(); resend(rs); return; }
    var dr = ev.target.closest && ev.target.closest('[data-role=mst-dup-remove]');
    if (dr) {
      ev.preventDefault();
      var rowEl = dr.closest('[data-role=mst-row]');
      if (dr.getAttribute('data-single') === '1' && dr.getAttribute('data-armed') !== '1') {
        dr.setAttribute('data-armed', '1');
        dr.textContent = '한 번 더 누르면 빼요 — 마켓 상품은 그대로';
        return;
      }
      dr.disabled = true;
      fetch('/seller/collect/' + encodeURIComponent(curItem) + '/upload-record/remove', {method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({market: dr.getAttribute('data-market'), product_id: dr.getAttribute('data-pid'),
          purpose: dr.getAttribute('data-single') === '1' ? 'reregister' : 'dedupe'})})
        .then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.ok) { window.kgpMarketStatus(curItem, dr.getAttribute('data-market')); return; }
          dr.disabled = false;
          var o = document.createElement('div'); o.className = 'mst-err'; o.textContent = (d && d.error) || '빼지 못했어요';
          rowEl && rowEl.appendChild(o);
        }).catch(function () { dr.disabled = false; });
      return;
    }
    if (ev.target === dlg || ev.target.closest('[data-role=mst-close]')) dlg.close ? dlg.close() : dlg.removeAttribute('open');
  });
  // M7: 이미 등록된 마켓(data-registered)을 다시 체크하면 「중복 등록」 확인 **한 번** — 이 화면에서 한 번 확인하면 다시 묻지 않는다.
  //   네이티브 confirm 대신 그 줄 아래 한 줄(폰 카드엔 확인 창 함수가 없다).
  var dupOk = false;
  document.addEventListener('change', function (ev) {
    var box = ev.target;
    if (!box || !box.matches || !box.matches('input[type=checkbox][data-registered="1"]') || !box.checked || dupOk) return;
    box.checked = false;
    var host = box.closest('label') || box.parentNode;
    if (!host || (host.nextElementSibling && host.nextElementSibling.matches('[data-role=dup-confirm]'))) return;
    var bar = document.createElement('div');
    bar.className = 'mk-dup-confirm'; bar.setAttribute('data-role', 'dup-confirm');
    bar.innerHTML = '<span>이미 등록된 마켓이에요 — 다시 올리면 같은 상품이 하나 더 생겨요.</span>' +
      '<button type="button" data-role="dup-yes">중복 등록</button><button type="button" data-role="dup-no">취소</button>';
    host.parentNode.insertBefore(bar, host.nextSibling);
    bar.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      e.preventDefault();
      if (b.getAttribute('data-role') === 'dup-yes') {
        dupOk = true; box.checked = true; box.dispatchEvent(new Event('change', {bubbles: true}));
      }
      bar.remove();
    });
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-market-status]');
    if (!t) return;
    ev.preventDefault();
    window.kgpMarketStatus(t.getAttribute('data-item'), t.getAttribute('data-market-status') || '');
  });
})();
</script>
