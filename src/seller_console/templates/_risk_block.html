{# Y10 리스크 게이트 위험 블록 — 폰 카드(_m5_flow)·데스크톱 사전검증(collect_preview)이 같은 렌더러를 쓴다.
   한 줄마다 ① 무엇이 어디서(원문 낱말·위치·사진 번호) ② 등급(차단·보류·주의) ③ 「빼고 등록」·「그래도 등록」(차단엔 없음)·「등록 안 함」.
   버튼은 data-role="risk-act" data-key data-action — 각 화면이 눌림을 받아 /risk-decision 후 사전검증을 다시 돈다. #}
<script>
window.kgpRiskBlockHtml = window.kgpRiskBlockHtml || function (risk) {
  if (!risk || !((risk.hits || []).length || risk.waiting || (risk.skip && risk.skip.reason) || (risk.notes || []).length)) return '';
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var hits = risk.hits || [];
  var open = hits.filter(function (h) { return h.grade !== 'caution' && !(h.decided === 'allow' && h.grade !== 'block'); }).length;
  var h = '<div class="kgp-risk" data-role="risk-block" data-open="' + open + '">';
  var cautionOnly = hits.length && hits.every(function (x) { return x.grade === 'caution'; });
  if (hits.length) h += '<div class="kgp-risk-head"><strong>' + (cautionOnly ? '주의 ' : '위험 ') + hits.length + '건</strong>' +
       (open ? ' <span class="kgp-risk-sub">— 고를 때까지 등록을 멈춰요</span>'
        : (cautionOnly ? ' <span class="kgp-risk-sub">— 등록은 그대로 진행돼요</span>' : ' <span class="kgp-risk-sub">— 다 골랐어요</span>')) + '</div>';
  if (risk.skip && risk.skip.reason) {
    h += '<div class="kgp-risk-skip" data-role="risk-skip"><span class="pc-badge pc-badge-danger">등록 보류: ' + esc(risk.skip.reason) + '</span>' +
         ' <button type="button" class="kgp-risk-btn" data-role="risk-act" data-key="" data-action="reset">보류 풀기</button>' +
         (risk.skip_hint ? '<div class="kgp-risk-why" data-role="risk-skip-hint">' + esc(risk.skip_hint) + '</div>' : '') + '</div>';
  }
  hits.forEach(function (x) {
    var tone = x.grade === 'block' ? 'pc-badge-danger' : (x.grade === 'hold' ? 'pc-badge-off' : 'pc-badge-caution');
    var done = x.decided === 'strip' ? '뺐어요' : (x.decided === 'allow' ? '그래도 등록(기록)' : '');
    h += '<div class="kgp-risk-row" data-role="risk-row" data-key="' + esc(x.key) + '" data-grade="' + esc(x.grade) + '">' +
      '<div><span class="pc-badge ' + tone + '">' + esc(x.grade_label) + '</span> <b>' + esc(x.cat) + '</b>: ' + esc((x.found || []).join('·')) + '</div>' +
      (x.where_line ? '<div class="kgp-risk-where" data-role="risk-where">' + esc(x.where_line) + '</div>' : '') +
      (x.why ? '<div class="kgp-risk-why">' + esc(x.why) + '</div>' : '');
    if (done) {
      h += '<div class="kgp-risk-done" data-role="risk-done">' + esc(done) + ' <button type="button" class="kgp-risk-btn" data-role="risk-act" data-key="' + esc(x.key) + '" data-action="reset">다시 고르기</button></div>';
    } else if (x.grade !== 'caution') {
      h += '<div class="kgp-risk-acts">' +
        '<button type="button" class="kgp-risk-btn is-main" data-role="risk-act" data-key="' + esc(x.key) + '" data-action="strip">빼고 등록</button>' +
        (x.can_allow ? '<button type="button" class="kgp-risk-btn" data-role="risk-act" data-key="' + esc(x.key) + '" data-action="allow">그래도 등록</button>' : '') +
        '<button type="button" class="kgp-risk-btn" data-role="risk-act" data-key="' + esc(x.key) + '" data-action="skip" data-reason="' + esc(x.cat + ' ' + (x.found || [])[0]) + '">등록 안 함</button></div>';
    }
    h += '</div>';
  });
  // Y11-G: 소품(책 표지 등) 글자에만 걸린 상표 — 차단·주의 아님, 참고 한 줄
  (risk.notes || []).forEach(function (n) { h += '<div class="kgp-risk-why" data-role="risk-note">' + esc(n) + '</div>'; });
  if (risk.waiting) h += '<div class="kgp-risk-wait" data-role="risk-wait">이미지 검사 대기 ' + esc(risk.waiting) + '장 — 사진 속 글자를 다 읽으면 다시 검사해요.</div>';
  if (open && risk.ai_waits) h += '<div class="kgp-risk-why" data-role="risk-ai-wait">AI 자동수정은 위 항목을 고른 뒤에 돌아요.</div>';
  return h + '</div>';
};
// Y11 — 사전검증 전 자동 판촉 지우기 결과 한 줄(폰·데스크톱 공용)
window.kgpImgEditNote = window.kgpImgEditNote || function (rows) {
  if (!rows || !rows.length) return '';
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var done = rows.filter(function (r) { return r.url; }), skip = rows.filter(function (r) { return !r.url; });
  var cr = done.reduce(function (a, r) { return a + (+r.credits || 0); }, 0);
  var h = '<div class="kgp-risk" data-role="img-edit-note">';
  if (done.length) h += '<div>사진 ' + done.map(function (r) { return r.idx + 1; }).join('·') + '번에서 판촉 상자 ' +
      done.reduce(function (a, r) { return a + (r.erased_n || 0); }, 0) + '개를 자동으로 지웠어요 — 「쿠팡 노출」의 「사진 편집」에서 확인·되돌리기 <span class="kgp-risk-sub">(' + cr.toFixed(3) + '크레딧)</span></div>';
  skip.forEach(function (r) { h += '<div class="kgp-risk-why">사진 ' + (r.idx + 1) + '번 — ' + esc(r.skipped) + '</div>'; });
  return h + '</div>';
};
// 순찰 106-B — 「등록 품질」(주의 · 등록은 막지 않음). 「자동 수정」 하나 = data-role="quality-fix" — 각 화면이 눌림을 받아
//   /quality-fix 후 저장본으로 사전검증을 다시 돈다. 사람이 고칠 줄(의류 대형화물)은 버튼 대상이 아니다.
window.kgpQualityHtml = window.kgpQualityHtml || function (q, fixed) {
  q = q || {}; fixed = fixed || {};
  var lines = q.lines || [], done = fixed.done || [], left = fixed.left || [];
  if (!lines.length && !done.length && !left.length) return '';
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var h = '<div class="kgp-risk" data-role="quality-block" data-fixable="' + esc(q.fixable || 0) + '">' +
    '<div class="kgp-risk-head"><strong>' + (lines.length ? '등록 품질 ' + lines.length + '건' : '등록 품질 — 다 고쳤어요') + '</strong>' +
    (lines.length ? ' <span class="kgp-risk-sub">— 등록은 그대로 진행돼요</span>' : '') + '</div>';
  lines.forEach(function (x) {
    h += '<div class="kgp-risk-row" data-role="quality-row" data-code="' + esc(x.code) + '"><div><span class="pc-badge pc-badge-caution">주의</span> ' +
      esc(x.line) + '</div>' + (x.fix ? '' : '<div class="kgp-risk-why">자동으로 못 고쳐요 — 직접 고쳐 주세요.</div>') + '</div>';
  });
  if (q.fixable) h += '<div class="kgp-risk-acts"><button type="button" class="kgp-risk-btn is-main" data-role="quality-fix">자동 수정 ' + esc(q.fixable) + '건</button></div>';
  if (done.length) h += '<div class="kgp-risk-done" data-role="quality-done">고쳤어요: ' + done.map(esc).join(' · ') + '</div>';
  if (left.length) h += left.map(function (l) { return '<div class="kgp-risk-why" data-role="quality-left">' + esc(l) + '</div>'; }).join('');
  return h + '</div>';
};
// 순찰 106-C — 등록 전 AI 검수: 접힌 줄 하나(펼치면 5줄 이내). AI는 제안만 — 버튼 없음(결정은 사람이).
window.kgpAiReviewHtml = window.kgpAiReviewHtml || function (r) {
  if (!r || !r.status || r.status === 'skip') return '';
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  var lines = r.lines || [];
  var head = r.status === 'done' ? (lines.length ? 'AI 검수 · 짚을 점 ' + lines.length + '개' : 'AI 검수 · 이상한 점 없음')
    : (r.status === 'running' ? 'AI 검수 · 아직이에요' : 'AI 검수 · 못 했어요');
  var h = '<details class="kgp-risk kgp-ai-review" data-role="ai-review" data-status="' + esc(r.status) + '"' + (window._kgpAiReviewOpen ? ' open' : '') +
    '><summary><strong>' + esc(head) + '</strong>' +
    ' <span class="kgp-risk-sub">— AI 제안이에요, 결정은 직접</span></summary>';
  if (lines.length) h += '<ul class="kgp-ai-review-list">' + lines.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  if (r.why) h += '<div class="kgp-risk-why">' + esc(r.why) + '</div>';
  return h + '</details>';
};
// 결과 카드는 폴링마다 다시 그려진다 — 펼친 상태를 기억해 다시 그려도 펼친 채로
if (!window._kgpAiReviewToggle) {
  window._kgpAiReviewToggle = true;
  document.addEventListener('toggle', function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute('data-role') === 'ai-review') window._kgpAiReviewOpen = !!t.open;
  }, true);
}
window.kgpQualityFix = window.kgpQualityFix || function (itemId, btn) {
  btn.disabled = true; btn.textContent = '고치는 중…';
  return fetch('/seller/collect/' + encodeURIComponent(itemId) + '/quality-fix', {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'}, body: '{}'})
    .then(function (r) { return r.json(); })
    .then(function (d) { if (!d.ok) { btn.disabled = false; btn.textContent = '자동 수정'; } return d; })
    .catch(function () { btn.disabled = false; btn.textContent = '자동 수정'; return {ok: false, error: '고치지 못했어요 — 다시 눌러 주세요'}; });
};
window.kgpRiskAct = window.kgpRiskAct || function (itemId, btn) {
  var action = btn.getAttribute('data-action'), key = btn.getAttribute('data-key') || '';
  btn.disabled = true;
  return fetch('/seller/collect/' + encodeURIComponent(itemId) + '/risk-decision', {method: 'POST', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({key: key, action: action, reason: btn.getAttribute('data-reason') || ''})})
    .then(function (r) { return r.json(); })
    .then(function (d) { if (!d.ok) { btn.disabled = false; } return d; })
    .catch(function () { btn.disabled = false; return {ok: false, error: '저장하지 못했어요 — 다시 눌러 주세요'}; });
};
</script>
