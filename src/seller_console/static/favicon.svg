<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="코고가네 글러브 마크">
  <!-- v13: 브랜드 마크 = 글러브 모노그램(먹 배경 + 금 글러브 + 청록 소맷동/궤도). 지구본 폐기. -->
  <rect width="512" height="512" rx="112" fill="#1a1714"/>
  <!-- 청록 궤도 악센트 -->
  <path d="M104 158 A206 206 0 0 1 410 386" fill="none" stroke="#119a8e" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  <!-- 글러브(미튼): 엄지 + 손등 + 하이라이트 + 청록 소맷동 -->
  <ellipse cx="172" cy="242" rx="52" ry="64" fill="#c9a24b"/>
  <rect x="188" y="112" width="190" height="220" rx="74" fill="#c9a24b"/>
  <rect x="196" y="120" width="168" height="86" rx="60" fill="#e0bc6e"/>
  <rect x="178" y="320" width="210" height="74" rx="26" fill="#119a8e"/>
</svg>
