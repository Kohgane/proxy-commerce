<!DOCTYPE html>
<html lang="ko">
<head>
  {% set _brand_name = brand_name|default('Goga Bridj', true) %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} | {{ _brand_name }}</title>
  <meta property="og:site_name" content="{{ _brand_name }}">
  <meta property="og:title" content="{{ _brand_name }}">
  <link rel="icon" type="image/svg+xml" href="/seller/static/favicon.svg?v=175">
  <link rel="icon" type="image/x-icon" href="/seller/static/favicon.ico?v=175">
  <link rel="apple-touch-icon" href="/seller/static/apple-touch-icon.png?v=175">
  <link rel="manifest" href="/seller/static/manifest.webmanifest?v=175">
  <meta name="theme-color" content="#f8fafc">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="/admin/static/css/style.css">
</head>
<body>
{% include "partials/topnav.html" %}
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 sidebar p-3">
      <h5 class="mb-3">🛒 Admin</h5>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/admin/">대시보드</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/products">상품 목록</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/orders">주문 목록</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/inventory">재고 현황</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/diagnostics">진단</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/users">사용자 관리</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/env">환경변수</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/logs">로그</a></li>
      </ul>
    </nav>
    <main class="col-md-10 p-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/admin/static/js/app.js"></script>
</body>
</html>
