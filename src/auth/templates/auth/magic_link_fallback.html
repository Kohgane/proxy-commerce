<!doctype html>
<html lang="ko">
<head>
  {% include "auth/_auth_head.html" %}
  <title>이메일 로그인 링크 — 고가브릿지</title>
</head>
<body class="auth-page">
  <div class="auth-card auth-card-wide">
    <div class="card auth-panel border-0">
      <div class="card-body p-4">
        <div class="alert alert-warning py-2 small"><strong>이메일 발송 실패.</strong> 아래 1회용 링크를 사용하세요.</div>
        <div class="d-flex gap-2 flex-wrap">
          <code class="flex-grow-1 auth-note" id="magic-link" style="min-width:240px;word-break:break-all;">{{ link }}</code>
          <button type="button" class="btn btn-outline-secondary" onclick="copyLink()">복사</button>
        </div>
        <div class="text-muted small mt-2">대상 이메일: {{ email }}</div>
        <div class="text-muted small">만료까지 <strong id="countdown">--:--</strong></div>
        <div class="alert alert-danger py-2 small mt-3 mb-0">보안 메모: 이 링크는 본인만 사용. 다른 사람과 공유 금지.</div>
      </div>
    </div>
  </div>
  <script>
    function copyLink() {
      const text = document.getElementById('magic-link').textContent || '';
      navigator.clipboard.writeText(text);
    }
    (function initCountdown() {
      let remaining = {{ ttl_minutes|int }} * 60;
      const el = document.getElementById('countdown');
      function render() {
        if (remaining < 0) {
          el.textContent = '만료됨';
          return;
        }
        const m = String(Math.floor(remaining / 60)).padStart(2, '0');
        const s = String(remaining % 60).padStart(2, '0');
        el.textContent = `${m}:${s}`;
        remaining -= 1;
      }
      render();
      setInterval(render, 1000);
    })();
  </script>
</body>
</html>
