<!DOCTYPE html>
<html lang="ko">
<head>
  {% include "auth/_auth_head.html" %}
  <title>비밀번호 재설정 — 고가브릿지</title>
</head>
{% import "auth/_auth_macros.html" as am %}
<body class="auth-page">
<div class="auth-card">
  <div class="card auth-panel border-0">
    <div class="card-body p-4">
      {{ am.brand('비밀번호 재설정') }}

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="/auth/reset">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="mb-3">
          <label class="form-label small" for="reset-password">새 비밀번호 (8자 이상)</label>
          <input id="reset-password" type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label small" for="reset-confirm">비밀번호 확인</label>
          <input id="reset-confirm" type="password" name="confirm" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">비밀번호 변경</button>
      </form>
      <div class="auth-foot text-center mt-3 small">
        <a href="/auth/login" class="text-decoration-none">← 로그인으로 돌아가기</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
