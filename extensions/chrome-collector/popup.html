<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고가수집기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; font-size: 14px; background: #fff; color: #1a1714; }
    .header { background: linear-gradient(135deg, #1a1714 0%, #2a2620 100%); color: #f5efe3; padding: 16px; text-align: center; border-bottom: 2px solid #c9a24b; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; color: #c9a24b; }
    .content { padding: 16px; }
    .src-badge { display: flex; align-items: center; gap: 8px; border-radius: 9px; padding: 9px 12px; margin-bottom: 12px; font-size: 12.5px; font-weight: 600; }
    .src-badge.on { background: #d9f0ec; color: #0c5a52; }
    .src-badge.off { background: #f4efe2; color: #8a8170; }
    .page-info { background: #f8f6f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 11.5px; color: #8a8170; word-break: break-all; }
    .page-info .url { color: #119a8e; font-weight: 500; }
    .btn-collect { width: 100%; background: #119a8e; color: #fff; border: none; border-radius: 9px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
    .btn-collect:hover { opacity: 0.92; }
    .btn-collect:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
    .status.success { background: #d9f0ec; color: #0c5a52; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.loading { background: #fdf0e2; color: #8a5a1a; }
    .preview-link { display: block; margin-top: 8px; color: #119a8e; text-decoration: none; font-size: 12px; }
    .footer { padding: 8px 16px; border-top: 1px solid #f0e9d9; display: flex; justify-content: space-between; font-size: 11px; color: #a39a87; }
    .footer a { color: #119a8e; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h1><svg width="22" height="22" viewBox="0 0 512 512" style="vertical-align:-4px" aria-hidden="true"><circle cx="256" cy="205" r="92" fill="none" stroke="#c9a24b" stroke-width="40"/><line x1="80" y1="338" x2="432" y2="338" stroke="#119a8e" stroke-width="36" stroke-linecap="round"/><line x1="80" y1="378" x2="432" y2="378" stroke="#119a8e" stroke-width="36" stroke-linecap="round"/><line x1="150" y1="338" x2="150" y2="378" stroke="#c9a24b" stroke-width="14"/><line x1="256" y1="338" x2="256" y2="378" stroke="#c9a24b" stroke-width="14"/><line x1="362" y1="338" x2="362" y2="378" stroke="#c9a24b" stroke-width="14"/><circle cx="256" cy="113" r="40" fill="#f5821f"/></svg> 고가수집기</h1>
    <p>지정 소싱처에서 한 번에 수집</p>
  </div>

  <div class="content">
    <div class="src-badge off" id="srcBadge">확인 중…</div>

    <div class="page-info">
      <div class="url" id="pageUrl">페이지 로딩 중...</div>
    </div>

    <button class="btn-collect" id="btnCollect">이 상품 수집하기</button>

    <label class="fab-toggle" id="fabToggleWrap" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:9px 12px;background:#f8f6f0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer">
      <span>페이지에 ‘수집’ 버튼 표시</span>
      <input type="checkbox" id="fabToggle" checked style="width:36px;height:20px;cursor:pointer">
    </label>

    <!-- v64 STEP3: 호버 수집 버튼 위치(이미지 영역 앵커) -->
    <label class="fab-toggle" id="anchorWrap" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:9px 12px;background:#f8f6f0;border-radius:8px;font-size:12.5px;font-weight:600">
      <span>수집 버튼 위치</span>
      <select id="hoverAnchor" style="font-size:12.5px;font-weight:600;padding:4px 8px;border:1px solid #d8d0c0;border-radius:6px;background:#fff;cursor:pointer">
        <option value="center">가운데</option>
        <option value="bl">좌하(7시)</option>
        <option value="br">우하(5시)</option>
      </select>
    </label>

    <!-- v54 STEP2: 자가진단 모드 — 상품 API 응답을 스스로 찾도록 콘솔 표 출력 -->
    <label class="fab-toggle" id="diagToggleWrap" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:9px 12px;background:#f8f6f0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer">
      <span>수집 자가진단 모드 <span style="font-weight:400;color:#7a726a">(F12 콘솔에 후보 표)</span></span>
      <input type="checkbox" id="diagToggle" style="width:36px;height:20px;cursor:pointer">
    </label>

    <!-- v63 STEP1: 감지 디버그 패널 — '왜 버튼이 안 떠?'를 캡처 한 장으로. 현재 탭의 실측 상태. -->
    <div id="detectPanel" style="margin-top:8px;padding:9px 12px;background:#1a1714;color:#f5efe3;border-radius:8px;font-size:11.5px;line-height:1.7">
      <div style="font-weight:700;color:#c9a24b;margin-bottom:3px">감지 진단</div>
      <div id="detectBody" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#e8ded0">불러오는 중…</div>
    </div>

    <!-- v64 STEP1: 벌크 상세 보강 큐 진행률(n/총 · 일시정지 · 중단) -->
    <div id="enrichPanel" style="display:none;margin-top:8px;padding:9px 12px;background:#f8f6f0;border-radius:8px;font-size:12.5px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span style="font-weight:700;color:#1a1714">상세 보강 <span id="enrichCount">0/0</span></span>
        <span>
          <button id="enrichPause" style="font-size:12px;font-weight:600;padding:3px 9px;border:1px solid #c9a24b;border-radius:6px;background:#fff;color:#1a1714;cursor:pointer">일시정지</button>
          <button id="enrichStop" style="font-size:12px;font-weight:600;padding:3px 9px;border:1px solid #d8d0c0;border-radius:6px;background:#fff;color:#8a5a2b;cursor:pointer">중단</button>
        </span>
      </div>
      <div id="enrichNote" style="margin-top:3px;color:#7a726a;font-size:11.5px"></div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    <a id="manageLink"><svg width="14" height="14" viewBox="0 0 512 512" style="vertical-align:-2px" aria-hidden="true"><circle cx="256" cy="205" r="92" fill="none" stroke="#119a8e" stroke-width="46"/><line x1="80" y1="356" x2="432" y2="356" stroke="#119a8e" stroke-width="46" stroke-linecap="round"/><circle cx="256" cy="108" r="40" fill="#f5821f"/></svg> 소싱처 관리</a>
    <a id="optionsLink">설정</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
